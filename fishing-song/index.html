<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"songTitle","type":"string","label":"Song title","default":"The River Song"},
    {"id":"kicker","type":"string","label":"Kicker","default":"a fishing song"},
    {"id":"highlight","type":"color","label":"Sung-word colour","default":"#ffd27a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #1d2a27;
        --ink: #ffffff;
        --deep: #10302b;
        --highlight: #ffd27a;
        --font-display: "Playfair Display", serif;
        --font-ui: "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #river {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
      }
      #title,
      #lyrics {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14.2"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="river"
        class="clip"
        src="assets/river.mp4"
        data-start="0"
        data-duration="14.2"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <audio
        id="song"
        class="clip"
        src="assets/music/river-song.wav"
        data-start="0"
        data-duration="14.2"
        data-track-index="3"
        data-volume="1"
      ></audio>
      <div
        id="title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="2.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="lyrics"
        data-composition-id="lyrics"
        data-composition-src="compositions/lyrics.html"
        data-start="0"
        data-duration="14.2"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
