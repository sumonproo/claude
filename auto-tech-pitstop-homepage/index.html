<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Tech Pitstop – Homepage (Desktop reference)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:hover{opacity:.92}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #36A3E6;outline-offset:3px}
details summary::-webkit-details-marker{display:none}
.cta-photo{background-image:linear-gradient(90deg,rgba(11,14,19,0.97) 0%,rgba(11,14,19,0.88) 50%,rgba(11,14,19,0.55) 100%),url(assets/cta-lift.webp);background-size:cover;background-position:center 40%}
</style>
<style>body{background:#07090D}</style>
</head>
<body>
<div id="app"></div>
<template id="design-template">
<div style="width: 1440px; margin: 0 auto; background: #0B0E13; color: #EEF1F5; font-family: 'IBM Plex Sans', system-ui, sans-serif">

<!-- UTILITY BAR -->
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 120px; height: 40px; background: #07090D; border-bottom: 1px solid #1B212B; font-size: 13px; color: #A3ADBB">
<div style="display: flex; gap: 24px; align-items: center">
<span>Walk-ins welcome · Appointments preferred</span>
<span style="color: #3A4352">|</span>
<span>Mon–Sat 9:30 am – 6:00 pm · Sun closed</span>
</div>
<div style="display: flex; gap: 24px; align-items: center">
<span>Towing available upon request</span>
<a href="https://www.autotechpitstop.com/" style="color: #EEF1F5; text-decoration: none; font-weight: 500">Pitstop Apparel Co.</a>
</div>
</div>

<!-- HEADER -->
<header style="position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 80px; height: 80px; background: rgba(11,14,19,0.96); border-bottom: 1px solid #1B212B">
<a href="#top" aria-label="Auto Tech Pitstop home" style="display: flex; align-items: center; min-height: 44px; text-decoration: none">
<img src="assets/logo-transparent.webp" alt="Auto Tech Pitstop" width="162" height="40" style="display: block; width: 162px; height: 40px">
</a>
<nav aria-label="Main" style="display: flex; gap: 20px; font-size: 14px; font-weight: 500; white-space: nowrap">
<a href="#top" style="text-decoration: none; color: #EEF1F5">Home</a>
<a href="#services" style="text-decoration: none; color: #C9D0DA">Services</a>
<a href="#choose-location" style="text-decoration: none; color: #C9D0DA">Locations</a>
<a href="#gallery" style="text-decoration: none; color: #C9D0DA">Gallery</a>
<a href="#reviews" style="text-decoration: none; color: #C9D0DA">Reviews</a>
<a href="#blog" style="text-decoration: none; color: #C9D0DA">Blog</a>
<a href="#footer" style="text-decoration: none; color: #C9D0DA">Contact</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px; position: relative; flex-shrink: 0">
<button type="button" onClick="{{toggleDd}}" aria-haspopup="listbox" aria-expanded="{{ddOpen}}" style="white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; background: #151A22; border: 1px solid #2B3340; color: #EEF1F5; font: 500 14px/1 'IBM Plex Sans', sans-serif; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span>{{locLabel}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<a href="{{g.quote}}" onClick="{{g.quoteClick}}" style="white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #3A4352; color: #EEF1F5; text-decoration: none; font-weight: 600; font-size: 14px">Request a Quote</a>
<a href="{{g.book}}" onClick="{{g.bookClick}}" style="white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 14px">Book Appointment</a>
<sc-if value="{{ddOpen}}" hint-placeholder-val="{{ false }}">
<div role="listbox" aria-label="Choose your location" style="position: absolute; top: 56px; left: 0; width: 320px; padding: 8px; border-radius: 14px; background: #151A22; border: 1px solid #2B3340; box-shadow: 0 24px 48px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{locList}}" as="l" hint-placeholder-count="2">
<button type="button" onClick="{{l.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 14px; border-radius: 10px; background: {{l.ddBg}}; border: none; color: #EEF1F5; text-align: left; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif">
<span style="font-weight: 600; font-size: 15px">{{l.name}}</span>
<span style="font-size: 13px; color: #A3ADBB">{{l.addr1}}, {{l.addr2}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
</header>

<!-- HERO -->
<section id="top" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center; padding: 80px 120px 88px; background-color: #0B0E13; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 120px)">
<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; border: 1px solid #2B3340; background: #11151C; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #C9D0DA">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC97"></span>
<span>LOCALLY OWNED · 10+ YEARS · 2 SHOPS</span>
</div>
<h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: -0.01em">Premium Auto Repair in Queens &amp; Long Island</h1>
<p style="margin: 0; max-width: 540px; font-size: 19px; line-height: 1.55; color: #C9D0DA">From routine maintenance and advanced diagnostics to brakes, alignments, rim repair and roadside help — reliable service, clear communication and easy online booking.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<a href="{{g.book}}" onClick="{{g.bookClick}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>
<span>Book an Appointment</span>
</a>
<a href="{{g.quote}}" onClick="{{g.quoteClick}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 12px; background: #EEF1F5; color: #0B0E13; text-decoration: none; font-weight: 600; font-size: 17px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h5"></path></svg>
<span>Request a Quote</span>
</a>
</div>
<div style="display: flex; gap: 24px; font-size: 15px; font-weight: 500">
<a href="tel:+13474333740" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #EEF1F5; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
<span>Call (347) 433-3740</span>
</a>
<a href="{{g.dir}}" onClick="{{g.dirClick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #EEF1F5; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span>Get Directions</span>
</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; padding-top: 24px; border-top: 1px solid #1F2630">
<sc-for list="{{heroTrust}}" as="t" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #C9D0DA">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#36A3E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
<span>{{t}}</span>
</div>
</sc-for>
</div>
</div>
<div style="position: relative; height: 620px">
<div style="position: absolute; inset: 0 0 40px 60px; border-radius: 20px; overflow: hidden; border: 1px solid #242B36; background: #161B24">
<img src="assets/hero-gwagon.webp" alt="Performance SUV in a brightly lit service bay while technicians work on wheels and tires" fetchpriority="high" style="display: block; width: 100%; height: 100%; object-fit: cover">
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 240px; height: 240px; border-radius: 16px; overflow: hidden; border: 4px solid #0B0E13; background: #1D232E; box-shadow: 0 24px 48px rgba(0,0,0,0.45)">
<img src="assets/hero-inset-lift.webp" alt="Car raised on a two-post lift during service" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover">
</div>
<div style="position: absolute; right: 28px; top: 28px; width: 260px; padding: 20px; border-radius: 16px; background: #FFFFFF; color: #10141B; box-shadow: 0 24px 48px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="color: #E8A317; font-size: 18px; letter-spacing: 2px">★★★★★</span>
</div>
<div style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 30px; line-height: 1">350+</div>
<div style="font-size: 14px; line-height: 1.4; color: #4A5361">Five-star Google reviews across both locations</div>
</div>
</div>
</section>

<!-- CHOOSE LOCATION -->
<section id="choose-location" style="padding: 104px 120px; background: #F4F5F7; color: #10141B; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 720px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: {{accent}}">STEP 1 · PICK YOUR SHOP</span>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 44px; line-height: 1.08">Choose Your Auto Tech Pitstop Location</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #4A5361">Select the location closest to you to book service, request a quote, call our team, get directions and view local reviews.</p>
</div>
<sc-if value="{{hasLoc}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D5DAE1; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B8A5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
<span>Your shop: <strong>{{cur.name}}</strong></span>
<button type="button" onClick="{{clearLoc}}" style="min-height: 36px; padding: 0 10px; border: none; background: transparent; color: #16639A; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer; text-decoration: underline">Change</button>
</div>
</sc-if>
</div>
<sc-if value="{{showNeed}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 12px; background: #E3F1FA; border: 1px solid #A9D4EF; color: #0C3553; font-size: 16px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span>Pick a shop below to {{needLabel}} — each location has its own booking calendar and directions.</span>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px">
<sc-for list="{{locList}}" as="l" hint-placeholder-count="2">
<article style="display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 2px solid {{l.border}}; overflow: hidden; box-shadow: 0 1px 2px rgba(16,20,27,0.06)">
<div role="img" aria-label="{{l.mapAlt}}" style="position: relative; height: 200px; background-color: #E3E7EC; background-image: repeating-linear-gradient(0deg, rgba(16,20,27,0.06) 0 1px, transparent 1px 32px), repeating-linear-gradient(90deg, rgba(16,20,27,0.06) 0 1px, transparent 1px 32px); display: flex; align-items: center; justify-content: center">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; box-shadow: 0 0 0 10px rgba(36,138,202,0.22)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
</span>
<span style="position: absolute; left: 20px; bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #4A5361">STATIC MAP IMAGE · CLICK LOADS GOOGLE MAPS</span>
<sc-if value="{{l.selected}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 16px; top: 16px; padding: 6px 12px; border-radius: 999px; background: #10141B; color: #FFFFFF; font-size: 13px; font-weight: 600">Your shop</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 22px; padding: 32px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #5B6472">LOCATION {{l.idx}}</span>
<h3 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 115%; font-weight: 800; font-size: 28px; line-height: 1.15">{{l.title}}</h3>
<span style="font-size: 15px; color: #4A5361">{{l.area}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; font-size: 15px; line-height: 1.5">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #5B6472">ADDRESS</span>
<span>{{l.addr1}}</span>
<span>{{l.addr2}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #5B6472">HOURS</span>
<span>Mon–Sat 9:30 am – 6:00 pm</span>
<span>Sunday closed</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #5B6472">PHONE</span>
<a href="{{l.tel}}" style="color: #10141B; font-weight: 600; text-decoration: none">{{l.phone}}</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #5B6472">GOOGLE RATING</span>
<span><span style="color: #B7791F">★★★★★</span> [4.9] · [000] reviews</span>
</div>
</div>
<blockquote style="margin: 0; padding: 16px 18px; border-radius: 12px; background: #F4F5F7; font-size: 15px; line-height: 1.5; color: #2B323D">“{{l.snippet}}” <span style="display: block; margin-top: 6px; font-size: 13px; color: #5B6472">— [Customer first name], Google review</span></blockquote>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="{{l.book}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Book Appointment</a>
<a href="{{l.quote}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 10px; background: #10141B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Request a Quote</a>
<a href="{{l.tel}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 10px; border: 1px solid #C9CFD8; color: #10141B; text-decoration: none; font-weight: 600; font-size: 15px">Call Now</a>
<a href="{{l.dir}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 10px; border: 1px solid #C9CFD8; color: #10141B; text-decoration: none; font-weight: 600; font-size: 15px">Get Directions</a>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid #E3E7EC">
<button type="button" onClick="{{l.pick}}" aria-pressed="{{l.selected}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #C9CFD8; background: #FFFFFF; color: #10141B; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">{{l.pickLabel}}</button>
<a href="{{l.page}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #16639A; font-weight: 600; font-size: 15px; text-decoration: none">{{l.details}} →</a>
</div>
</div>
</article>
</sc-for>
</div>
</section>

<!-- TRUST -->
<section style="padding: 104px 120px; background: #0B0E13; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 48px 24px">
<div style="grid-column: span 5; display: flex; flex-direction: column; gap: 20px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #36A3E6">WHY DRIVERS CHOOSE US</span>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 44px; line-height: 1.08">Auto Repair Built Around Your Time and Peace of Mind</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #C9D0DA">Whether you need a quick repair, scheduled maintenance, diagnostic testing or emergency roadside help, Auto Tech Pitstop makes the process simple — knowledgeable technicians, straightforward updates and convenient service options.</p>
<img src="assets/alignment-tech.webp" alt="Technician attaching wheel alignment equipment to an SUV" loading="lazy" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 50% 30%; border-radius: 16px; margin-top: 8px">
</div>
<div style="grid-column: 7 / span 6; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #1F2630; border: 1px solid #1F2630; border-radius: 16px; overflow: hidden">
<sc-for list="{{trust}}" as="t" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 24px; background: #0F131A">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#36A3E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
<h3 style="margin: 0; font-size: 17px; font-weight: 600">{{t.title}}</h3>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A3ADBB">{{t.text}}</p>
</div>
</sc-for>
</div>
</section>

<!-- SERVICES -->
<section id="services" style="padding: 104px 120px; background: #FFFFFF; color: #10141B; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 760px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: {{accent}}">SERVICES</span>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 44px; line-height: 1.08">Complete Auto Repair and Maintenance Services</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #4A5361">From routine maintenance to complex repairs, reliable service for drivers across Queens, NYC and Long Island.</p>
</div>

/* Tiny template runtime: renders the design's {{holes}}, <sc-for>, <sc-if> and on* handlers.
   Reference build only — rebuild as real components (Elementor widgets, theme templates, etc.). */
class DCLogic {
  constructor(props) { this.props = props || {}; if (!this.state) this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); if (this.__render) this.__render(); }
}
(function () {
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function get(scope, path) {
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (_, p) => str(get(scope, p))))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = get(scope, (node.getAttribute('list').match(WHOLE) || [])[1]) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => { const s = Object.create(scope); s[as] = item; s.$index = i; node.childNodes.forEach(c => walk(c, s, out)); });
      return;
    }
    if (tag === 'sc-if') {
      const m = node.getAttribute('value').match(WHOLE);
      if (m && get(scope, m[1])) node.childNodes.forEach(c => walk(c, scope, out));
      return;
    }
    const el = document.createElementNS(node.namespaceURI, node.localName);
    for (const a of node.attributes) {
      if (a.name.startsWith('hint-')) continue;
      const whole = a.value.match(WHOLE);
      if (a.name.startsWith('on') && whole) { const fn = get(scope, whole[1]); if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn); continue; }
      el.setAttribute(a.name, a.value.replace(HOLE, (_, p) => str(get(scope, p))));
    }
    const src = tag === 'template' ? node.content : node;
    src.childNodes.forEach(c => walk(c, scope, el));
    out.appendChild(el);
  }
  window.mountDesign = function (Component, props) {
    const tpl = document.getElementById('design-template').content;
    const root = document.getElementById('app');
    const inst = new Component(props);
    inst.__render = function () {
      const openDetails = [...root.querySelectorAll('details')].map(d => d.open);
      const frag = document.createDocumentFragment();
      tpl.childNodes.forEach(c => walk(c, inst.renderVals(), frag));
      root.replaceChildren(frag);
      root.querySelectorAll('details').forEach((d, i) => { if (openDetails[i]) d.open = true; });
    };
    inst.__render();
  };
})();
